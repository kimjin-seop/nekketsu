# /etc/nginx/conf.d/nekketsu.oddplay.kr.conf
# HTTPS 인증서는 certbot이 이 파일에 자동으로 추가합니다 (tank·liero 와 같은 관례: 여기에는 80 만 둔다. DEPLOY.md 참고)
# 앱 포트 3600 은 ecosystem.config.js 의 PORT 와 같아야 한다(서버의 다른 앱 포트와 충돌하는지 확인 후 확정).
#
# 지켜야 할 것(어기면 게임이 안 뜨거나 보안 정책이 무너진다):
#  1) 응답 헤더 COOP/COEP/CORP 는 Node 가 이미 붙인다. nginx 에서 add_header 로 중복 추가하거나 proxy_hide_header 로 지우지 않는다
#     (SharedArrayBuffer·crossOriginIsolated 에 필요. 중복 헤더는 브라우저가 무시할 수 있다).
#  2) Host·X-Forwarded-For($proxy_add_x_forwarded_for)·X-Forwarded-Proto 를 / 와 /ws 둘 다에서 넘긴다.
#     앱은 NK_TRUST_PROXY=1 로 XFF 의 맨 오른쪽 값을 접속 IP 로 쓰고(접속 수 제한·랭크 같은 IP 판정), X-Forwarded-Proto=https 일 때만
#     원작 ROM 파생물(/rom /state /ui /engine/gen)을 세션 있는 요청에 준다.
#  3) 앞단에 CDN·프록시(Cloudflare 등)를 더 두면 NK_TRUST_PROXY_HOPS 를 단수에 맞게 올리고, 보호 경로(/rom/ /state/ /ui/ /engine/gen/)는 캐시하지 않게 한다.
#  4) proxy_cache·gzip_proxied 로 앱 응답을 다시 캐시·압축하지 않는다(앱이 ETag·br/gzip·private 헤더를 직접 처리한다).

# 주의: `map $http_upgrade $connection_upgrade { default upgrade; '' close; }` 는 이 서버의 /etc/nginx/conf.d/ 에서
# liero·tank·tongki 가 이미 정의한다(같은 변수를 두 번 정의하면 nginx -t 가 중복 오류). 그래서 여기서는 정의하지 않고 그 변수를 쓴다.
# 다른 곳에 map 이 없는 서버에 올릴 때만 아래 4줄의 주석을 풀 것.
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 80;
    listen [::]:80;
    server_name nekketsu.oddplay.kr;

    location / {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # 3MB 짜리 엔진 코드·6MB 폰트 등 큰 정적 응답용 여유
    }

    # 온라인 대전 실시간 통신 (WebSocket, 앱 경로는 정확히 /ws)
    location /ws {
        proxy_pass http://127.0.0.1:3600;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # tank 사례에는 없지만 열혈은 IP 제한·랭크 판정에 필요
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        tcp_nodelay on;
    }
}
