/* 와이드 장식(game.js 가 ?classic=1 이 아닐 때 html.nk-wide 를 붙인다): 코어 밖을 CSS 배경으로 채우고 코어 둘레에 이중 창틀을 두른다. 캔버스 좌우 88px 는 투명.

:root{--nkb-a:#0b1238;--nkb-b:#1a1042;--nkb-c:#2b0e46;--nkb-glow:rgba(150,112,255,.2);--nkb-dot:rgba(255,255,255,.075);--nkb-l:rgba(255,82,82,.13);--nkb-r:rgba(64,156,255,.15);--nkb-d:clamp(14px,2.6vmin,30px)}

.nk-wide.nk-fight #stage{background:radial-gradient(ellipse 62% 78% at 50% 50%,var(--nkb-glow),transparent 72%),radial-gradient(ellipse 42% 85% at 0 55%,var(--nkb-l),transparent 70%),radial-gradient(ellipse 42% 85% at 100% 55%,var(--nkb-r),transparent 70%),linear-gradient(160deg,var(--nkb-a),var(--nkb-b) 55%,var(--nkb-c))}
.nk-wide #stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle,var(--nkb-dot) 0 23%,transparent 25%) 0 0/var(--nkb-d) var(--nkb-d),radial-gradient(circle,var(--nkb-dot) 0 23%,transparent 25%) calc(var(--nkb-d)/2) calc(var(--nkb-d)/2)/var(--nkb-d) var(--nkb-d),linear-gradient(115deg,transparent 32%,rgba(255,255,255,.045) 46%,transparent 60%);
  -webkit-mask-image:linear-gradient(115deg,#000,rgba(0,0,0,.25) 34%,rgba(0,0,0,.25) 66%,#000);mask-image:linear-gradient(115deg,#000,rgba(0,0,0,.25) 34%,rgba(0,0,0,.25) 66%,#000)}
.nk-wide canvas{background:transparent}
.nk-wide #stage::after{content:"";position:absolute;left:var(--nk-l,0);top:var(--nk-t,0);width:calc(256px*var(--nk-s,1));height:calc(1px*var(--nk-h,240)*var(--nk-s,1));pointer-events:none;
